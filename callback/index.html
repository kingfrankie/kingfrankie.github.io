<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<title>Tesla sign-in complete</title>
<style>body{font-family:system-ui,sans-serif;max-width:36rem;margin:2rem auto;padding:0 1rem;line-height:1.5}
textarea{width:100%;height:7rem;font-family:monospace;font-size:.85rem}button{font-size:1.1rem;padding:.6rem 1.2rem;margin-top:.5rem}
.err{color:#b00}</style>
</head><body>
<h1>Tesla approval received</h1>
<div id="ok" hidden>
  <p>Copy this whole link and paste it back to Grok Bot. It expires in a few minutes.</p>
  <textarea id="v" readonly></textarea><br>
  <button id="b">Copy</button> <span id="s"></span>
</div>
<p id="bad" class="err" hidden></p>
<script>
// Nothing is sent anywhere: this page only displays the code so it can be pasted to the bot.
var q = new URLSearchParams(location.search);
if (q.get('code')) {
  document.getElementById('ok').hidden = false;
  var t = document.getElementById('v'); t.value = location.href;
  document.getElementById('b').onclick = function () {
    t.select(); (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject())
      .then(function(){document.getElementById('s').textContent='Copied';},
            function(){document.execCommand('copy');document.getElementById('s').textContent='Copied';});
  };
} else {
  var b = document.getElementById('bad'); b.hidden = false;
  b.textContent = 'No authorization code in this link' + (q.get('error') ? ': ' + q.get('error') + ' ' + (q.get('error_description') || '') : '.');
}
</script>
</body></html>
